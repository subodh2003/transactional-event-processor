services:
  - type: web
    name: transactional-event-processor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: false   # deploys are triggered by CI (deploy hook) after tests pass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-processor-db
          property: connectionString
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "5"

databases:
  - name: event-processor-db
    plan: free
    databaseName: event_processor
    user: event_processor
